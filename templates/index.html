<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Product List</title>
  <style>
    body {
      background-color: #121212;
      color: #ffffff;
      font-family: Arial, sans-serif;
      margin: 0;
      padding: 20px;
    }

    h1 {
      text-align: center;
      color: #00bcd4;
    }

    .products {
      display: flex;
      flex-wrap: wrap;
      gap: 20px;
      justify-content: center;
    }

    .product-card {
      background-color: #1e1e1e;
      border: 1px solid #333;
      border-radius: 10px;
      width: 250px;
      padding: 15px;
      box-shadow: 0 0 10px rgba(0,0,0,0.4);
      transition: transform 0.2s ease-in-out;
    }

    .product-card:hover {
      transform: scale(1.05);
    }

    .product-card img {
      width: 100%;
      border-radius: 6px;
      margin-bottom: 10px;
    }

    .product-card h3 {
      margin: 0;
      color: #ff9800;
    }

    .product-card p {
      margin: 5px 0;
      font-size: 14px;
    }

    .product-card .price {
      color: #4caf50;
      font-weight: bold;
    }
  </style>
</head>
<body>
  <h1>Our Products</h1>
  <div class="products">
    {{productCards}}
  </div>
</body>
</html>
