<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Product Details</title>
  <style>
    body {
      background-color: #121212;
      color: #ffffff;
      font-family: Arial, sans-serif;
      margin: 0;
      padding: 2rem;
    }

    .container {
      max-width: 700px;
      margin: auto;
      background-color: #1e1e1e;
      border-radius: 10px;
      padding: 2rem;
      box-shadow: 0 0 10px rgba(0, 0, 0, 0.8);
    }

    .product-image {
      width: 100%;
      border-radius: 8px;
      margin-bottom: 1.5rem;
    }

    h1 {
      color: #f2f2f2;
      margin-bottom: 1rem;
    }

    .price {
      color: #00e676;
      font-size: 1.5rem;
      margin-bottom: 1rem;
    }

    p {
      color: #cccccc;
      line-height: 1.6;
    }

    a {
      display: inline-block;
      margin-top: 2rem;
      color: #00bcd4;
      text-decoration: none;
    }

    a:hover {
      text-decoration: underline;
    }
  </style>
</head>
<body>
  <div class="container">
    <img src="{{image}}" alt="{{name}}" class="product-image" />
    <h1>{{name}}</h1>
    <div class="price">{{price}}</div>
    <p>{{description}}</p>
    <a href="/overview">← Back to products</a>
  </div>
</body>
</html>
